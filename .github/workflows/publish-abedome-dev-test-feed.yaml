name: Publish ABEDOME dev test update feed

on:
  workflow_dispatch:
    inputs:
      supervisor_version:
        description: Published ABEDOME Supervisor test version
        required: true
        type: string
      supervisor_version_baseline:
        description: Exact Supervisor version currently installed on the validation VM
        required: true
        type: string
      supervisor_digest:
        description: Approved OCI digest for the Supervisor image
        required: true
        type: string
      core_version:
        description: Published ABEDOME Core development version
        required: true
        type: string
      core_version_baseline:
        description: Exact Core version currently installed on the validation VM
        required: true
        type: string
      core_digest:
        description: Approved OCI digest for the Core image
        required: true
        type: string
      hassos_ova_version:
        description: Exact signed HAOS OVA/RAUC version
        required: true
        type: string
      ota_url_template:
        description: GitHub Release RAUC URL containing {version} and {board}
        required: true
        type: string

permissions: {}

concurrency:
  group: abedome-dev-test-update-feed
  cancel-in-progress: false

jobs:
  render:
    name: Render and stage dev feed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out protected development source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate release inputs and publication scope
        env:
          OTA_URL_TEMPLATE: ${{ inputs.ota_url_template }}
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
          SUPERVISOR_VERSION_BASELINE: ${{ inputs.supervisor_version_baseline }}
          SUPERVISOR_DIGEST: ${{ inputs.supervisor_digest }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_VERSION_BASELINE: ${{ inputs.core_version_baseline }}
          CORE_DIGEST: ${{ inputs.core_digest }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/abedome/develop" ]; then
            echo "The ABEDOME dev feed may only be published from abedome/develop."
            exit 1
          fi

          if ! printf '%s' "${SUPERVISOR_VERSION}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use a published Supervisor test version such as 2026.8.0.dev1."
            exit 2
          fi

          if ! printf '%s' "${SUPERVISOR_VERSION_BASELINE}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use the exact development version reported by ha supervisor info on the validation VM."
            exit 2
          fi

          if ! printf '%s' "${SUPERVISOR_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Use the exact sha256 OCI digest produced by the approved Supervisor workflow."
            exit 2
          fi

          if ! printf '%s' "${CORE_VERSION}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use a published Core development version such as 2026.9.0.dev1."
            exit 1
          fi

          if ! printf '%s' "${CORE_VERSION_BASELINE}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use the exact development version reported by ha core info on the validation VM."
            exit 1
          fi

          if ! printf '%s' "${CORE_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Use the exact sha256 OCI digest produced by the approved Core workflow."
            exit 1
          fi

          case "${OTA_URL_TEMPLATE}" in
            https://github.com/Mauro2020/abedome-os/releases/download/*)
              ;;
            *)
              echo "Use a GitHub Release URL from Mauro2020/abedome-os."
              exit 1
              ;;
          esac

      - name: Verify approved ABEDOME Supervisor digest
        env:
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
          SUPERVISOR_DIGEST: ${{ inputs.supervisor_digest }}
        run: |
          resolved_digest="$(
            docker buildx imagetools inspect \
              "ghcr.io/mauro2020/abedome-supervisor:${SUPERVISOR_VERSION}" \
              | awk '$1 == "Digest:" && digest == "" { digest = $2 } END { print digest }'
          )"

          if [ -z "${resolved_digest}" ] || [ "${resolved_digest}" != "${SUPERVISOR_DIGEST}" ]; then
            echo "The published Supervisor tag does not match the approved OCI digest."
            echo "Expected: ${SUPERVISOR_DIGEST}"
            echo "Resolved: ${resolved_digest:-missing}"
            exit 1
          fi

      - name: Verify approved ABEDOME Core digest
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_DIGEST: ${{ inputs.core_digest }}
        run: |
          resolved_digest="$(
            docker buildx imagetools inspect \
              "ghcr.io/mauro2020/abedome-core:${CORE_VERSION}" \
              | awk '$1 == "Digest:" && digest == "" { digest = $2 } END { print digest }'
          )"

          if [ -z "${resolved_digest}" ] || [ "${resolved_digest}" != "${CORE_DIGEST}" ]; then
            echo "The published Core tag does not match the approved OCI digest."
            echo "Expected: ${CORE_DIGEST}"
            echo "Resolved: ${resolved_digest:-missing}"
            exit 1
          fi

      - name: Download upstream dev manifest
        run: |
          curl --fail --silent --show-error --location \
            "https://version.home-assistant.io/dev.json" \
            --output upstream-dev.json

      - name: Render validated ABEDOME dev manifest
        env:
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
          SUPERVISOR_VERSION_BASELINE: ${{ inputs.supervisor_version_baseline }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_VERSION_BASELINE: ${{ inputs.core_version_baseline }}
          CORE_DIGEST: ${{ inputs.core_digest }}
          HASSOS_OVA_VERSION: ${{ inputs.hassos_ova_version }}
          OTA_URL_TEMPLATE: ${{ inputs.ota_url_template }}
        run: |
          python3 scripts/render_abedome_update_manifest.py \
            --source upstream-dev.json \
            --output site/updates/dev.json \
            --supervisor-version "${SUPERVISOR_VERSION}" \
            --supervisor-version-baseline "${SUPERVISOR_VERSION_BASELINE}" \
            --supervisor-image "ghcr.io/mauro2020/abedome-supervisor" \
            --core-version "${CORE_VERSION}" \
            --core-version-baseline "${CORE_VERSION_BASELINE}" \
            --core-image "ghcr.io/mauro2020/abedome-core" \
            --hassos-ova-version "${HASSOS_OVA_VERSION}" \
            --ota-url-template "${OTA_URL_TEMPLATE}"

      - name: Create technical landing page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>ABEDOME test updates</title>
            </head>
            <body>
              <h1>ABEDOME dev test update feed</h1>
              <p>This endpoint is for manually approved ABEDOME development validation only.</p>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy dev feed
    needs: render
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Publish summary
        env:
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
          SUPERVISOR_VERSION_BASELINE: ${{ inputs.supervisor_version_baseline }}
          SUPERVISOR_DIGEST: ${{ inputs.supervisor_digest }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_VERSION_BASELINE: ${{ inputs.core_version_baseline }}
          CORE_DIGEST: ${{ inputs.core_digest }}
          HASSOS_OVA_VERSION: ${{ inputs.hassos_ova_version }}
        run: |
          {
            echo "## ABEDOME dev test update feed"
            echo
            echo "- Feed: \`${{ steps.deployment.outputs.page_url }}updates/dev.json\`"
            echo "- Supervisor candidate: \`${SUPERVISOR_VERSION}\`"
            echo "- Installed Supervisor baseline: \`${SUPERVISOR_VERSION_BASELINE}\`"
            echo "- Supervisor image: \`ghcr.io/mauro2020/abedome-supervisor\`"
            echo "- Supervisor digest: \`${SUPERVISOR_DIGEST}\`"
            echo "- Core version: \`${CORE_VERSION}\`"
            echo "- Installed Core baseline: \`${CORE_VERSION_BASELINE}\`"
            echo "- Core image: \`ghcr.io/mauro2020/abedome-core\`"
            echo "- Core digest: \`${CORE_DIGEST}\`"
            echo "- HAOS version: \`${HASSOS_OVA_VERSION}\`"
            echo "- Supported target: \`ova / qemux86-64 / linux-amd64\`"
            echo
            echo "This is a manually deployed test feed. Stable and beta channels are not published."
            echo "The Supervisor and Core tags were matched to their approved digests immediately before deployment."
            echo "The tag-based feed must not be used on another architecture or after republishing that tag."
          } >> "$GITHUB_STEP_SUMMARY"
