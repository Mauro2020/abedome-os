# Home Assistant Operating System build workflow

name: OS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      boards:
        description: 'List of boards to build (comma separated identifiers)'
        required: false
        type: string
      publish:
        description: 'Publish build artifacts to R2 (not applicable to forks)'
        required: true
        type: boolean
        default: true
      run_tests:
        description: 'Run tests after build'
        required: true
        type: boolean
        default: true
      hassio_channel:
        description: 'Release channel to use (default: stable for GH releases, dev otherwise)'
        type: choice
        required: true
        default: default
        options:
          - default
          - stable
          - beta
          - dev
      abedome_update_test:
        description: 'Build an isolated ABEDOME Proxmox update-test OVA (manual dev validation only)'
        required: true
        type: boolean
        default: false
      abedome_stable_candidate:
        description: 'Build an isolated ABEDOME stable-channel OVA candidate without publishing'
        required: true
        type: boolean
        default: false
  # The github context of a called workflow belongs to the caller, which can be any public repository.
  # Steps using OIDC or other release privileges must be gated on publish_build, which checks the repository.
  workflow_call:
    inputs:
      boards:
        description: 'List of boards to build (comma separated identifiers)'
        required: false
        type: string
      publish:
        description: 'Publish build artifacts to R2 (not applicable to forks)'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run tests after build'
        required: false
        type: boolean
        default: true
      hassio_channel:
        description: 'Release channel to use (default, stable, beta or dev)'
        required: false
        type: string
        default: default
      abedome_update_test:
        description: 'Build an isolated ABEDOME Proxmox update-test OVA'
        required: false
        type: boolean
        default: false
      abedome_stable_candidate:
        description: 'Build an isolated ABEDOME stable-channel OVA candidate'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.13"
  # These immutable index and linux/amd64 manifest digests were independently
  # verified after the approved Core and Supervisor publication workflows.
  ABEDOME_RELEASE_PINS_READY: "true"
  ABEDOME_PRELOADED_CORE_IMAGE: ghcr.io/mauro2020/abedome-core:2026.11.1
  ABEDOME_PRELOADED_CORE_DIGEST: sha256:d311b61cbc1e4549b0a4919ce5e66ceb7693b3c89cf27d41def6bd5c4154c211
  ABEDOME_PRELOADED_CORE_AMD64_DIGEST: sha256:50cfccddde92f1975c01b0f05df99d5b7122e7c3694e3b487e15d034d6c80940
  ABEDOME_PRELOADED_SUPERVISOR_IMAGE: ghcr.io/mauro2020/abedome-supervisor:2026.11.0
  ABEDOME_PRELOADED_SUPERVISOR_DIGEST: sha256:751e40e46ad35f890d07431d8cbfe96aa692d6508ad42d5c2081756347c8342b
  ABEDOME_PRELOADED_SUPERVISOR_AMD64_DIGEST: sha256:da8b1ce7b30415eddf6de3df6f4cfae9c8cd410d7be0fc8fe1b1f83db39c5ffb

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      packages: write
    outputs:
      version_dev: ${{ steps.abedome_candidate.outputs.version_dev || steps.version_dev.outputs.version_dev }}
      version_main: ${{ steps.version.outputs.version_main }}
      version_full: ${{ steps.version.outputs.version_full }}
      channel: ${{ steps.channel.outputs.channel }}
      hassio_channel: ${{ steps.channel.outputs.hassio_channel }}
      hassio_channel_option: ${{ steps.channel.outputs.hassio_channel_option }}
      matrix: ${{ steps.generate_matrix.outputs.result }}
      build_container_image: ghcr.io/${{ steps.registry_owner.outputs.owner }}/haos-builder@${{ steps.build_haos_builder.outputs.digest }}
      publish_build: ${{ steps.check_publish.outputs.publish_build }}
      self_signed_cert: ${{ steps.generate_signing_key.outputs.self_signed_cert }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if build should be published
        id: check_publish
        env:
          PUBLISH_FLAG: ${{ inputs.publish }}
        run: |
          if [ "${{ github.repository }}" == "home-assistant/operating-system" ]; then
            if [ "${PUBLISH_FLAG}" != "true" ] && [ "${{ github.event_name }}" != "release" ]; then
              echo "publish_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish_build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate development version
        shell: bash
        id: version_dev
        if: ${{ github.event_name != 'release' }}
        env:
          PUBLISH_BUILD: ${{ steps.check_publish.outputs.publish_build }}
        run: |
          version_dev="dev$(date --utc +'%Y%m%d')"
          if [ "${{ env.PUBLISH_BUILD }}" != "true" ] || [ "${{ github.ref }}" != "refs/heads/dev" ]; then
            version_dev="dev$(date +%s)"
          fi
          echo "Development version \"${version_dev}\""
          echo "version_dev=${version_dev}" >> $GITHUB_OUTPUT

      - name: Configure isolated ABEDOME candidate version
        id: abedome_candidate
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.abedome_update_test || inputs.abedome_stable_candidate) }}
        env:
          DEV_CANDIDATE: ${{ inputs.abedome_update_test }}
          STABLE_CANDIDATE: ${{ inputs.abedome_stable_candidate }}
          BOARDS: ${{ inputs.boards }}
          CHANNEL: ${{ inputs.hassio_channel }}
          PUBLISH: ${{ inputs.publish }}
          RUN_TESTS: ${{ inputs.run_tests }}
          CANDIDATE_SUFFIX: dev0
        run: |
          if [ "${DEV_CANDIDATE}" = "true" ] && [ "${STABLE_CANDIDATE}" = "true" ]; then
            echo "::error::Select only one ABEDOME candidate mode."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/abedome/develop" ]; then
            echo "::error::ABEDOME candidate builds may only run from abedome/develop."
            exit 1
          fi
          if [ "${BOARDS}" != "ova" ]; then
            echo "::error::ABEDOME candidate builds require boards=ova."
            exit 1
          fi
          expected_channel=dev
          if [ "${STABLE_CANDIDATE}" = "true" ]; then
            expected_channel=stable
          fi
          if [ "${CHANNEL}" != "${expected_channel}" ]; then
            echo "::error::This ABEDOME candidate requires hassio_channel=${expected_channel}."
            exit 1
          fi
          if [ "${PUBLISH}" != "false" ] || [ "${RUN_TESTS}" != "false" ]; then
            echo "::error::ABEDOME candidates require publish=false and run_tests=false."
            exit 1
          fi
          echo "version_dev=${CANDIDATE_SUFFIX}" >> "${GITHUB_OUTPUT}"
          . buildroot-external/meta
          echo "Using isolated ABEDOME ${expected_channel}-channel candidate version ${VERSION_MAJOR}.${VERSION_MINOR}.${CANDIDATE_SUFFIX}."

      - name: Set version suffix
        if: ${{ github.event_name != 'release' }}
        env:
          VERSION_DEV: ${{ steps.abedome_candidate.outputs.version_dev || steps.version_dev.outputs.version_dev }}
        run: |
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${VERSION_DEV}\2/" buildroot-external/meta

      - name: Get version
        id: version
        run: |
          . ${GITHUB_WORKSPACE}/buildroot-external/meta
          echo "version_main=${VERSION_MAJOR}.${VERSION_MINOR}" >> $GITHUB_OUTPUT
          if [ -z "${VERSION_SUFFIX}" ]; then
            version_full="${VERSION_MAJOR}.${VERSION_MINOR}"
          else
            version_full="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_SUFFIX}"
          fi
          echo "version_full=${version_full}" >> $GITHUB_OUTPUT
          echo "Full version number of this release is \"${version_full}\"."

      - name: Validate version
        id: version_check
        if: ${{ github.event_name == 'release' }}
        run: |
          if [ "${{ steps.version.outputs.version_full }}" != "${{ github.event.release.tag_name }}" ]; then
            echo "Version number in Buildroot metadata does not match tag (${{ steps.version.outputs.version_full }} vs ${{ github.event.release.tag_name }})."
            exit 1
          fi

      - name: Get channel
        id: channel
        env:
          HASSIO_CHANNEL: ${{ inputs.hassio_channel }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              echo "channel=beta" >> "$GITHUB_OUTPUT"
            else
              echo "channel=stable" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

          # Release events have no inputs
          case "${HASSIO_CHANNEL:-default}" in
            default)
              if [[ "${{ github.event_name }}" == "release" ]]; then
                echo "hassio_channel_option=BR2_PACKAGE_HASSIO_CHANNEL_STABLE" >> "$GITHUB_OUTPUT"
                echo "hassio_channel=stable" >> "$GITHUB_OUTPUT"
              else
                echo "hassio_channel_option=BR2_PACKAGE_HASSIO_CHANNEL_DEV" >> "$GITHUB_OUTPUT"
                echo "hassio_channel=dev" >> "$GITHUB_OUTPUT"
              fi
              ;;
            stable)
              echo "hassio_channel_option=BR2_PACKAGE_HASSIO_CHANNEL_STABLE" >> "$GITHUB_OUTPUT"
              echo "hassio_channel=stable" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "hassio_channel_option=BR2_PACKAGE_HASSIO_CHANNEL_BETA" >> "$GITHUB_OUTPUT"
              echo "hassio_channel=beta" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "hassio_channel_option=BR2_PACKAGE_HASSIO_CHANNEL_DEV" >> "$GITHUB_OUTPUT"
              echo "hassio_channel=dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown release channel '${HASSIO_CHANNEL}'. Channel must be 'default', 'stable', 'beta' or 'dev'."
              exit 1
              ;;
          esac

      - name: Validate deployment and version against publish channel
        if: ${{ steps.check_publish.outputs.publish_build == 'true' }}
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          VERSION_FULL: ${{ steps.version.outputs.version_full }}
        run: |
          . "${GITHUB_WORKSPACE}/buildroot-external/meta"
          case "${CHANNEL}" in
            dev)    expected_deployment="development"; version_re='^[0-9]+\.[0-9]+\.dev[0-9]+$' ;;
            beta)   expected_deployment="staging";     version_re='^[0-9]+\.[0-9]+\.rc[0-9]+$' ;;
            stable) expected_deployment="production";  version_re='^[0-9]+\.[0-9]+$' ;;
            *)
              echo "::error::Refusing to publish to an unknown '${CHANNEL}' channel." \
                "Channel must be 'dev', 'beta' or 'stable'."
              exit 1
              ;;
          esac
          if [ "${DEPLOYMENT}" != "${expected_deployment}" ]; then
            echo "::error::Deployment mismatch: publishing to '${CHANNEL}' requires DEPLOYMENT='${expected_deployment}'" \
              "but buildroot-external/meta has DEPLOYMENT='${DEPLOYMENT}'."
            exit 1
          fi
          if [[ ! "${VERSION_FULL}" =~ ${version_re} ]]; then
            echo "::error::Version '${VERSION_FULL}' does not match the '${CHANNEL}' channel format ${version_re}."
            exit 1
          fi

      - name: Create build matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: generate_matrix
        env:
          BOARDS: ${{ inputs.boards }}
          RUN_TESTS: ${{ inputs.run_tests }}
        with:
          script: |
            const boards = require('./.github/workflows/matrix.json')
            if ("${{ github.event_name }}" == "release") {
              return { "board": boards }
            }

            const boardFilter = process.env.BOARDS || ""
            const runTests = process.env.RUN_TESTS === "true"

            if (boardFilter == "") {
              console.log("Run full build for all boards")
              return { "board": boards }
            } else {
              console.log("Run partial build")
              const boardSet = new Set(boardFilter.split(","))

              // if tests are enabled, we need to ensure the OVA board is included
              if (runTests && !boardSet.has("ova")) {
                console.log("Adding OVA board for integration tests")
                boardSet.add("ova")
              }

              const buildBoards = boards.filter(b => boardSet.has(b.id))
              return { "board": buildBoards }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Derive lowercase registry owner
        id: registry_owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require resolved ABEDOME release pins
        if: ${{ github.repository == 'Mauro2020/abedome-os' }}
        env:
          RELEASE_PINS_READY: ${{ env.ABEDOME_RELEASE_PINS_READY }}
        run: |
          if [ "${RELEASE_PINS_READY}" != "true" ]; then
            echo "::error::ABEDOME Core/Supervisor release digests are still unresolved."
            exit 1
          fi
      - name: Verify approved ABEDOME Core preload
        if: ${{ github.repository == 'Mauro2020/abedome-os' }}
        env:
          CORE_IMAGE: ${{ env.ABEDOME_PRELOADED_CORE_IMAGE }}
          CORE_DIGEST: ${{ env.ABEDOME_PRELOADED_CORE_DIGEST }}
          CORE_AMD64_DIGEST: ${{ env.ABEDOME_PRELOADED_CORE_AMD64_DIGEST }}
        run: |
          resolved_digest="$(
            docker buildx imagetools inspect "${CORE_IMAGE}" \
              | awk '$1 == "Digest:" && digest == "" { digest = $2 } END { print digest }'
          )"
          if [[ "${resolved_digest}" != "${CORE_DIGEST}" ]]; then
            echo "::error::ABEDOME Core ${CORE_IMAGE} resolved to ${resolved_digest}, expected ${CORE_DIGEST}."
            exit 1
          fi

          raw_index="$(docker buildx imagetools inspect --raw "${CORE_IMAGE}")"
          if ! jq -e \
            --arg digest "${CORE_AMD64_DIGEST}" \
            'any(.manifests[]?; .digest == $digest and .platform.os == "linux" and .platform.architecture == "amd64")' \
            <<< "${raw_index}" > /dev/null; then
            echo "::error::The approved linux/amd64 Core manifest was not found in ${CORE_IMAGE}."
            exit 1
          fi
      - name: Verify approved ABEDOME Supervisor preload
        if: ${{ github.repository == 'Mauro2020/abedome-os' }}
        env:
          SUPERVISOR_IMAGE: ${{ env.ABEDOME_PRELOADED_SUPERVISOR_IMAGE }}
          SUPERVISOR_DIGEST: ${{ env.ABEDOME_PRELOADED_SUPERVISOR_DIGEST }}
          SUPERVISOR_AMD64_DIGEST: ${{ env.ABEDOME_PRELOADED_SUPERVISOR_AMD64_DIGEST }}
        run: |
          resolved_digest="$(
            docker buildx imagetools inspect "${SUPERVISOR_IMAGE}" \
              | awk '$1 == "Digest:" && digest == "" { digest = $2 } END { print digest }'
          )"
          if [[ "${resolved_digest}" != "${SUPERVISOR_DIGEST}" ]]; then
            echo "::error::ABEDOME Supervisor ${SUPERVISOR_IMAGE} resolved to ${resolved_digest}, expected ${SUPERVISOR_DIGEST}."
            exit 1
          fi

          raw_index="$(docker buildx imagetools inspect --raw "${SUPERVISOR_IMAGE}")"
          if ! jq -e \
            --arg digest "${SUPERVISOR_AMD64_DIGEST}" \
            'any(.manifests[]?; .digest == $digest and .platform.os == "linux" and .platform.architecture == "amd64")' \
            <<< "${raw_index}" > /dev/null; then
            echo "::error::The approved linux/amd64 Supervisor manifest was not found in ${SUPERVISOR_IMAGE}."
            exit 1
          fi
      - name: Prepare and validate RAUC signing material
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        run: |
          abedome_candidate=false
          if [[ "${GITHUB_REPOSITORY}" == "Mauro2020/abedome-os" ]] && \
             { [[ "${GITHUB_REF}" == "refs/heads/abedome/develop" ]] || \
               [[ "${GITHUB_EVENT_NAME}" == "release" ]]; }; then
            abedome_candidate=true
          fi

          if [[ -n "${RAUC_CERTIFICATE}" || -n "${RAUC_PRIVATE_KEY}" ]] && \
             { [[ -z "${RAUC_CERTIFICATE}" ]] || [[ -z "${RAUC_PRIVATE_KEY}" ]]; }; then
            echo "::error::RAUC_CERTIFICATE and RAUC_PRIVATE_KEY must be configured together."
            exit 1
          fi

          if [[ -z "${RAUC_CERTIFICATE}" ]]; then
            if [[ "${abedome_candidate}" == "true" ]]; then
              echo "::error::ABEDOME candidate builds require the persistent RAUC signing certificate and private key."
              exit 1
            fi
            exit 0
          fi

          trap 'rm -f cert.pem key.pem' EXIT
          bash buildroot-external/scripts/prepare-rauc-signing-material.sh cert.pem key.pem
          scripts/check-signing-validity.sh cert.pem buildroot-external/ota/rel-ca.pem 760

          if [[ "${abedome_candidate}" == "true" ]]; then
            configured_fingerprint="$(openssl x509 -in cert.pem -outform DER | openssl dgst -sha256)"
            pinned_fingerprint="$(openssl x509 -in buildroot-external/ota/abedome-update-signing.pem -outform DER | openssl dgst -sha256)"
            if [[ "${configured_fingerprint}" != "${pinned_fingerprint}" ]]; then
              echo "::error::The configured RAUC certificate does not match the audited ABEDOME update trust anchor."
              exit 1
            fi
          fi
      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build_haos_builder
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/${{ steps.registry_owner.outputs.owner }}/haos-builder
          cache-from: ghcr.io/${{ steps.registry_owner.outputs.owner }}/haos-builder:cache-${{ steps.version.outputs.version_main }}
          cache-to: ghcr.io/${{ steps.registry_owner.outputs.owner }}/haos-builder:cache-${{ steps.version.outputs.version_main }}
          push: true

      - name: Generate self-signed certificate
        id: generate_signing_key
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        if: env.RAUC_CERTIFICATE == '' || env.RAUC_PRIVATE_KEY == ''
        run: |
          echo "::warning:: RAUC certificate or key is missing in the repository secrets. Building with a public self-signed certificate!"
          buildroot-external/scripts/generate-signing-key.sh cert.pem key.pem
          echo "self_signed_cert=true" >> $GITHUB_OUTPUT

      - name: Create signing key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.generate_signing_key.outcome == 'success'
        with:
          name: signing-key
          path: |
            cert.pem
            key.pem

  build:
    name: Build for ${{ matrix.board.id }}
    permissions:
      contents: write  # for actions/upload-release-asset to upload release asset
    needs: prepare
    strategy:
      fail-fast: ${{ github.event_name == 'release' }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Python version ${{ env.PYTHON_VERSION }}
        if: ${{ github.event_name != 'release' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS CLI
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build == 'true' }}
        run: pip install 'awscli<1.37.0'

      - name: Set version suffix
        if: ${{ github.event_name != 'release' }}
        env:
          VERSION_DEV: ${{ needs.prepare.outputs.version_dev }}
        run: |
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${VERSION_DEV}\2/" buildroot-external/meta

      - name: Materialize validated release PKI certs
        if: ${{ needs.prepare.outputs.self_signed_cert != 'true' }}
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        run: bash buildroot-external/scripts/prepare-rauc-signing-material.sh cert.pem key.pem
      - name: Get self-signed certificate from the prepare job
        if: ${{ needs.prepare.outputs.self_signed_cert == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signing-key

      - name: Free space on build drive
        run: |
          # Inspired by https://github.com/easimon/maximize-build-space/blob/v7/action.yml
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo mkdir /mnt/cache
          sudo mkdir /mnt/output
          WORKSPACE_OWNER="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
          # output directory is symlinked for easier access from workspace
          # but for build container it must be mounted as a volume
          sudo ln -sf /mnt/output "${GITHUB_WORKSPACE}/output"
          sudo chown -R "${WORKSPACE_OWNER}" /mnt/cache
          sudo chown -R "${WORKSPACE_OWNER}" /mnt/output
          df -h

      - name: "Restore cache: object files"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ matrix.board.id }}

      - name: Generate build config
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: make ${{ matrix.board.defconfig }}_defconfig

      - name: Configure controlled ABEDOME candidate image
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.abedome_update_test || inputs.abedome_stable_candidate) }}
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: |
            bash -ec 'grep -Fxq "BR2_PACKAGE_HASSIO_SUPERVISOR_IMAGE=\"${{ env.ABEDOME_PRELOADED_SUPERVISOR_IMAGE }}\"" /build/output/.config && grep -Fxq "BR2_PACKAGE_HASSIO_CORE_IMAGE=\"${{ env.ABEDOME_PRELOADED_CORE_IMAGE }}\"" /build/output/.config && grep -Fxq "BR2_PACKAGE_HASSIO_SUPERVISOR_VERSION_URL=\"https://mauro2020.github.io/abedome-os/updates/{channel}.json\"" /build/output/.config'

      - name: Verify configured ABEDOME Core platform image
        if: ${{ matrix.board.id == 'ova' && github.repository == 'Mauro2020/abedome-os' }}
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: |
            bash -ec '
              core_image="${{ env.ABEDOME_PRELOADED_CORE_IMAGE }}"
              expected_digest="${{ env.ABEDOME_PRELOADED_CORE_AMD64_DIGEST }}"
              expected_version="${core_image##*:}"
              inspect="$(skopeo inspect --override-arch amd64 "docker://${core_image}")"
              test "$(jq -r ".Digest" <<< "${inspect}")" = "${expected_digest}"
              test "$(jq -r ".Architecture" <<< "${inspect}")" = "amd64"
              test "$(jq -r ".Os" <<< "${inspect}")" = "linux"
              test "$(jq -r ".Labels[\"io.hass.arch\"]" <<< "${inspect}")" = "amd64"
              test "$(jq -r ".Labels[\"io.hass.type\"]" <<< "${inspect}")" = "core"
              test "$(jq -r ".Labels[\"io.hass.version\"]" <<< "${inspect}")" = "${expected_version}"
            '

      - name: Verify configured ABEDOME Supervisor platform image
        if: ${{ matrix.board.id == 'ova' && github.repository == 'Mauro2020/abedome-os' }}
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: |
            bash -ec '
              supervisor_image="${{ env.ABEDOME_PRELOADED_SUPERVISOR_IMAGE }}"
              expected_digest="${{ env.ABEDOME_PRELOADED_SUPERVISOR_AMD64_DIGEST }}"
              expected_version="${supervisor_image##*:}"
              inspect="$(skopeo inspect --override-arch amd64 "docker://${supervisor_image}")"
              test "$(jq -r ".Digest" <<< "${inspect}")" = "${expected_digest}"
              test "$(jq -r ".Architecture" <<< "${inspect}")" = "amd64"
              test "$(jq -r ".Os" <<< "${inspect}")" = "linux"
              test "$(jq -r ".Labels[\"io.hass.arch\"]" <<< "${inspect}")" = "amd64"
              test "$(jq -r ".Labels[\"io.hass.type\"]" <<< "${inspect}")" = "supervisor"
              test "$(jq -r ".Labels[\"io.hass.version\"]" <<< "${inspect}")" = "${expected_version}"
            '

      - name: Override release channel
        if: ${{ needs.prepare.outputs.hassio_channel_option != 'BR2_PACKAGE_HASSIO_CHANNEL_STABLE' }}
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: |
            bash -c 'echo "${{ needs.prepare.outputs.hassio_channel_option }}=y" >> /build/output/.config && make olddefconfig'

      - name: Build
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: make

      - name: Verify embedded ABEDOME Core preload
        if: ${{ matrix.board.id == 'ova' && github.repository == 'Mauro2020/abedome-os' }}
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: |
            bash scripts/check-abedome-ova-build.sh \
              /build/output \
              "${{ env.ABEDOME_PRELOADED_CORE_IMAGE }}" \
              "${{ env.ABEDOME_PRELOADED_CORE_DIGEST }}" \
              "${{ env.ABEDOME_PRELOADED_SUPERVISOR_IMAGE }}" \
              "${{ needs.prepare.outputs.hassio_channel }}"

      - name: Check Linux config
        uses: "./.github/actions/haos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: |
            make BR2_CHECK_DOTCONFIG_OPTS="--github-format --strip-path-prefix=/build/" linux-check-dotconfig

      - name: Compute image digests
        if: ${{ github.event_name == 'release' || needs.prepare.outputs.publish_build == 'true' || (github.event_name == 'workflow_dispatch' && inputs.abedome_stable_candidate) }}
        working-directory: output/images/
        run: sha256sum haos_* > SHA256SUMS.${{ matrix.board.id }}

      - name: Upload image digests artifact
        if: ${{ github.event_name == 'release' || needs.prepare.outputs.publish_build == 'true' || (github.event_name == 'workflow_dispatch' && inputs.abedome_stable_candidate) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums-${{ matrix.board.id }}
          path: output/images/SHA256SUMS.${{ matrix.board.id }}

      - name: Upload artifacts
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build == 'true' }}
        working-directory: output/images/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_OS_ARTIFACTS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_OS_ARTIFACTS_KEY }}
        run: |
          aws s3 sync \
            ./ \
            s3://${{ secrets.R2_OS_ARTIFACTS_BUCKET }}/${{ needs.prepare.outputs.version_full }}/ \
            --exclude "*" \
            --include "haos_*" \
            --endpoint-url ${{ secrets.R2_OS_ARTIFACTS_ENDPOINT }}

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        uses: shogo82148/actions-upload-release-asset@9ee13965a8a51926f330b424693f25fcff8f2ef6 # v1.10.6
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: output/images/haos_*

      - name: Print cache stats
        run: |
          echo "Cache size: $(du -sh /mnt/cache/cc)"
          echo "Files total: $(find /mnt/cache/cc -mindepth 1 -type f | wc -l)"
          echo "Old files to remove: $(find /mnt/cache/cc -mindepth 1 -type f -not -anewer output/Makefile | wc -l)"
          find /mnt/cache/cc -mindepth 1 -type f -not -anewer output/Makefile -delete
          echo "Cache size after pruning: $(du -sh /mnt/cache/cc)"

      - name: "Save cache: object files"
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ matrix.board.id }}-${{ github.run_id }}

      - name: Generate build summary
        env:
          HASSIO_CHANNEL: ${{ inputs.hassio_channel }}
        run: |
          echo "# ${{ matrix.board.id }} build summary" >> $GITHUB_STEP_SUMMARY
          echo "## Built-in OS components" >> $GITHUB_STEP_SUMMARY
          echo "Release channel: ${HASSIO_CHANNEL} (${{ needs.prepare.outputs.hassio_channel_option }})" >> $GITHUB_STEP_SUMMARY
          echo "| Container | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|:-|:-|" >> $GITHUB_STEP_SUMMARY
          supervisor_version=$(jq -r ".supervisor" output/build/hassio-*/version.json)
          supervisor_repository=$(jq -r ".images.supervisor" output/build/hassio-*/version.json)
          if [[ "${supervisor_repository}" == ghcr.io/home-assistant/* ]]; then
            echo "| supervisor | [${supervisor_version}](https://github.com/home-assistant/supervisor/releases/tag/${supervisor_version}) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| supervisor | \`${supervisor_repository}:${supervisor_version}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          core_repository=$(jq -r ".images.core" output/build/hassio-*/version.json)
          core_version=$(jq -r ".core" output/build/hassio-*/version.json)
          if [ "${core_version}" = "landingpage" ]; then
            landingpage_version=$(curl -fsSL https://api.github.com/repos/home-assistant/landingpage/releases/latest | jq -r '.tag_name')
            echo "| landingpage | [${landingpage_version}](https://github.com/home-assistant/landingpage/releases/tag/${landingpage_version}) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| managed Core | \`${core_repository}:${core_version}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          for plugin in dns audio cli multicast observer; do
            version=$(jq -r ".${plugin}" output/build/hassio-*/version.json)
            echo "| plugin-${plugin} | [${version}](https://github.com/home-assistant/plugin-${plugin}/releases/tag/${version}) |" >> $GITHUB_STEP_SUMMARY
          done
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size (bytes) | Size (formatted) |" >> $GITHUB_STEP_SUMMARY
          echo "|:-|:-|:-|" >> $GITHUB_STEP_SUMMARY
          for f in output/images/haos_*; do
            echo "| $(basename $f) | $(du -b $f | cut -f1) | $(du -bh $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done
          echo "## Partitions" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size (bytes) | Size (formatted) |" >> $GITHUB_STEP_SUMMARY
          echo "|:-|:-|:-|" >> $GITHUB_STEP_SUMMARY
          for f in boot.vfat kernel.img rootfs.erofs overlay.ext4 data.ext4; do
            echo "| ${f} | $(du -b output/images/$f | cut -f1) | $(du -bh output/images/$f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload OS image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build != 'true' && matrix.board.id != 'ova' }}
        with:
          archive: false
          name: haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.img.xz
          path: |
            output/images/haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.img.xz

      - name: Upload RAUC bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build != 'true' }}
        with:
          archive: false
          name: haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.raucb
          path: |
            output/images/haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.raucb

      - name: Upload Open Virtualization Format (OVA) artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build != 'true' && matrix.board.id == 'ova' }}
        with:
          archive: false
          name: haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.ova
          path: |
            output/images/haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.ova

      - name: Upload QEMU disk image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Create artifact for ova every time - it's used by the called tests workflow
        if: ${{ matrix.board.id == 'ova' || (github.event_name != 'release' && needs.prepare.outputs.publish_build != 'true' && matrix.board.id == 'generic-aarch64') }}
        with:
          archive: false
          name: haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.qcow2.xz
          path: |
            output/images/haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.qcow2.xz

      - name: Upload VMware Virtual Machine Disk (VMDK) artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build != 'true' && (matrix.board.id == 'generic-aarch64' || matrix.board.id == 'ova') }}
        with:
          archive: false
          name: haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.vmdk.zip
          path: |
            output/images/haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.vmdk.zip

      - name: Upload VirtualBox Virtual Disk Image (VDI) artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build != 'true' && matrix.board.id == 'ova' }}
        with:
          archive: false
          name: haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.vdi.zip
          path: |
            output/images/haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.vdi.zip

      - name: Upload Virtual Hard Disk v2 (VHDX) artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build != 'true' && matrix.board.id == 'ova' }}
        with:
          archive: false
          name: haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.vhdx.zip
          path: |
            output/images/haos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.vhdx.zip

  test:
    name: Test OS image
    if: ${{ github.event_name == 'release' || inputs.run_tests == true }}
    needs: [ build, prepare ]
    uses: ./.github/workflows/test.yaml
    with:
      version: ${{ needs.prepare.outputs.version_full }}
      # ABEDOME validates its signed RAUC bundle against a staged manifest on
      # the cloned PVE VM. The upstream public feed cannot contain a candidate
      # before that gate and must never be used as a circular release test.
      run_live_update_test: ${{ github.repository == 'home-assistant/operating-system' }}

  sign:
    name: Sign image digests
    if: ${{ github.event_name == 'release' || needs.prepare.outputs.publish_build == 'true' || (github.event_name == 'workflow_dispatch' && inputs.abedome_stable_candidate) }}
    needs: [ build, prepare ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # for actions/upload-release-asset to upload release asset
      id-token: write  # for cosign keyless signing

    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sha256sums-*
          merge-multiple: true

      - name: Merge image digests
        run: |
          cat SHA256SUMS.* | sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digests
        run: cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.sigstore.json

      - name: Setup Python version ${{ env.PYTHON_VERSION }}
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS CLI
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build == 'true' }}
        run: pip install 'awscli<1.37.0'

      - name: Upload signed digests to R2
        if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_OS_ARTIFACTS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_OS_ARTIFACTS_KEY }}
        run: |
          aws s3 sync \
            ./ \
            s3://${{ secrets.R2_OS_ARTIFACTS_BUCKET }}/${{ needs.prepare.outputs.version_full }}/ \
            --exclude "*" \
            --include "SHA256SUMS" \
            --include "SHA256SUMS.sigstore.json" \
            --endpoint-url ${{ secrets.R2_OS_ARTIFACTS_ENDPOINT }}

      - name: Upload signed candidate digests artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.abedome_stable_candidate }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abedome-stable-candidate-${{ needs.prepare.outputs.version_full }}-digests
          path: |
            SHA256SUMS
            SHA256SUMS.sigstore.json
          if-no-files-found: error

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        uses: shogo82148/actions-upload-release-asset@9ee13965a8a51926f330b424693f25fcff8f2ef6 # v1.10.6
        with:
          upload_url: ${{ github.event.release.upload_url }}
          overwrite: true
          asset_path: |
            SHA256SUMS
            SHA256SUMS.sigstore.json

  update_index:
    name: Update artifacts index
    if: ${{ github.event_name != 'release' && needs.prepare.outputs.publish_build == 'true' }}
    needs: [ build, sign, prepare ]
    uses: home-assistant/operating-system/.github/workflows/artifacts-index.yaml@dev
    with:
      version: ${{ needs.prepare.outputs.version_full }}
    secrets:
      R2_OS_ARTIFACTS_ID: ${{ secrets.R2_OS_ARTIFACTS_ID }}
      R2_OS_ARTIFACTS_KEY: ${{ secrets.R2_OS_ARTIFACTS_KEY }}
      R2_OS_ARTIFACTS_BUCKET: ${{ secrets.R2_OS_ARTIFACTS_BUCKET }}
      R2_OS_ARTIFACTS_ENDPOINT: ${{ secrets.R2_OS_ARTIFACTS_ENDPOINT }}
      CF_ZONE: ${{ secrets.CF_ZONE }}
      CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}

  bump_version:
    name: Bump ${{ needs.prepare.outputs.channel }} channel version
    if: ${{ github.repository == 'home-assistant/operating-system' && needs.prepare.outputs.publish_build == 'true' && (needs.prepare.outputs.channel != 'dev' || github.ref == 'refs/heads/dev') }}
    environment: ${{ needs.prepare.outputs.channel }}
    needs: [ build, sign, prepare ]
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize git
      uses: home-assistant/actions/helpers/git-init@master
      with:
        name: ${{ secrets.GIT_NAME }}
        email: ${{ secrets.GIT_EMAIL }}
        token: ${{ secrets.GIT_TOKEN }}

    - name: Bump Home Assistant OS ${{ needs.prepare.outputs.channel }} channel version
      uses: home-assistant/actions/helpers/version-push@master
      with:
        key: "hassos[]"
        key-description: "Home Assistant OS"
        version: ${{ needs.prepare.outputs.version_full }}
        channel: ${{ needs.prepare.outputs.channel }}

    - name: Bump Home Assistant OS beta channel version on stable release
      if: ${{ needs.prepare.outputs.channel == 'stable' }}
      uses: home-assistant/actions/helpers/version-push@master
      with:
        key: "hassos[]"
        key-description: "Home Assistant OS"
        version: ${{ needs.prepare.outputs.version_full }}
        channel: beta

    - name: Bump stable Home Assistant version for RPi Imager
      if: ${{ github.event_name == 'release' && needs.prepare.outputs.channel == 'stable' }}
      uses: "./.github/actions/bump-rpi-imager-version"
      with:
        version: ${{ needs.prepare.outputs.version_full }}
        release-date: ${{ github.event.release.published_at }}
