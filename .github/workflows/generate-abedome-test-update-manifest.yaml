name: Generate ABEDOME test update manifest

on:
  workflow_dispatch:
    inputs:
      source_channel:
        description: Upstream manifest channel to use as a complete base
        required: true
        default: dev
        type: choice
        options:
          - stable
          - beta
          - dev
      supervisor_version:
        description: Approved ABEDOME Supervisor image tag
        required: true
        type: string
      supervisor_version_baseline:
        description: Exact Supervisor version currently installed on the validation VM
        required: true
        type: string
      supervisor_image:
        description: Approved ABEDOME Supervisor GHCR repository, without tag
        required: true
        default: ghcr.io/mauro2020/abedome-supervisor
        type: string
      supervisor_digest:
        description: Approved OCI digest for the Supervisor image
        required: true
        type: string
      core_version:
        description: Approved ABEDOME Core image tag
        required: true
        type: string
      core_version_baseline:
        description: Exact Core version currently installed on the validation VM
        required: true
        type: string
      core_image:
        description: Approved ABEDOME Core GHCR repository, without tag
        required: true
        default: ghcr.io/mauro2020/abedome-core
        type: string
      core_digest:
        description: Approved OCI digest for the Core image
        required: true
        type: string
      hassos_ova_version:
        description: Exact signed OVA/RAUC version approved for the test
        required: true
        type: string
      ota_url_template:
        description: HTTPS RAUC URL template containing {version} and {board}
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render offline test manifest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download upstream base manifest
        env:
          CHANNEL: ${{ inputs.source_channel }}
        run: |
          curl --fail --silent --show-error --location \
            "https://version.home-assistant.io/${CHANNEL}.json" \
            --output upstream-manifest.json

      - name: Verify approved ABEDOME Supervisor digest
        env:
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
          SUPERVISOR_VERSION_BASELINE: ${{ inputs.supervisor_version_baseline }}
          SUPERVISOR_IMAGE: ${{ inputs.supervisor_image }}
          SUPERVISOR_DIGEST: ${{ inputs.supervisor_digest }}
        run: |
          if ! printf '%s' "${SUPERVISOR_VERSION}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use a published Supervisor development version such as 2026.8.0.dev2."
            exit 2
          fi

          if ! printf '%s' "${SUPERVISOR_VERSION_BASELINE}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use the exact development version reported by ha supervisor info on the validation VM."
            exit 2
          fi

          if [ "${SUPERVISOR_IMAGE}" != "ghcr.io/mauro2020/abedome-supervisor" ]; then
            echo "Use the approved ABEDOME Supervisor repository."
            exit 2
          fi

          if ! printf '%s' "${SUPERVISOR_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Use an exact sha256 OCI digest."
            exit 2
          fi

          resolved_digest="$(
            docker buildx imagetools inspect "${SUPERVISOR_IMAGE}:${SUPERVISOR_VERSION}" \
              | awk '$1 == "Digest:" && digest == "" { digest = $2 } END { print digest }'
          )"

          if [ -z "${resolved_digest}" ] || [ "${resolved_digest}" != "${SUPERVISOR_DIGEST}" ]; then
            echo "The Supervisor image does not match the approved OCI digest."
            echo "Expected: ${SUPERVISOR_DIGEST}"
            echo "Resolved: ${resolved_digest:-missing}"
            exit 1
          fi

      - name: Verify approved ABEDOME Core digest
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_VERSION_BASELINE: ${{ inputs.core_version_baseline }}
          CORE_IMAGE: ${{ inputs.core_image }}
          CORE_DIGEST: ${{ inputs.core_digest }}
        run: |
          if ! printf '%s' "${CORE_VERSION}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use a published Core development version such as 2026.9.0.dev1."
            exit 1
          fi

          if ! printf '%s' "${CORE_VERSION_BASELINE}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use the exact development version reported by ha core info on the validation VM."
            exit 1
          fi

          if ! printf '%s' "${CORE_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Use an exact sha256 OCI digest."
            exit 1
          fi

          resolved_digest="$(
            docker buildx imagetools inspect "${CORE_IMAGE}:${CORE_VERSION}" \
              | awk '$1 == "Digest:" && digest == "" { digest = $2 } END { print digest }'
          )"

          if [ -z "${resolved_digest}" ] || [ "${resolved_digest}" != "${CORE_DIGEST}" ]; then
            echo "The Core image does not match the approved OCI digest."
            exit 1
          fi

      - name: Render and validate ABEDOME manifest
        env:
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
          SUPERVISOR_VERSION_BASELINE: ${{ inputs.supervisor_version_baseline }}
          SUPERVISOR_IMAGE: ${{ inputs.supervisor_image }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_VERSION_BASELINE: ${{ inputs.core_version_baseline }}
          CORE_IMAGE: ${{ inputs.core_image }}
          HASSOS_OVA_VERSION: ${{ inputs.hassos_ova_version }}
          OTA_URL_TEMPLATE: ${{ inputs.ota_url_template }}
        run: |
          python3 scripts/render_abedome_update_manifest.py \
            --source upstream-manifest.json \
            --output abedome-${{ inputs.source_channel }}.json \
            --supervisor-version "${SUPERVISOR_VERSION}" \
            --supervisor-version-baseline "${SUPERVISOR_VERSION_BASELINE}" \
            --supervisor-image "${SUPERVISOR_IMAGE}" \
            --core-version "${CORE_VERSION}" \
            --core-version-baseline "${CORE_VERSION_BASELINE}" \
            --core-image "${CORE_IMAGE}" \
            --hassos-ova-version "${HASSOS_OVA_VERSION}" \
            --ota-url-template "${OTA_URL_TEMPLATE}"

      - name: Upload private test artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: abedome-test-update-manifest-${{ inputs.source_channel }}
          path: abedome-${{ inputs.source_channel }}.json
          retention-days: 7

      - name: Publish validation summary
        env:
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
          SUPERVISOR_VERSION_BASELINE: ${{ inputs.supervisor_version_baseline }}
          SUPERVISOR_DIGEST: ${{ inputs.supervisor_digest }}
        run: |
          {
            echo "## ABEDOME private test manifest"
            echo
            echo "- Supervisor candidate: \`${SUPERVISOR_VERSION}\`"
            echo "- Installed Supervisor baseline: \`${SUPERVISOR_VERSION_BASELINE}\`"
            echo "- Supervisor image: \`ghcr.io/mauro2020/abedome-supervisor\`"
            echo "- Supervisor digest: \`${SUPERVISOR_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
