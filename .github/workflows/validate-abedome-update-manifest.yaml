name: Validate ABEDOME update manifest tooling

on:
  pull_request:
    paths:
      - ".github/workflows/validate-abedome-update-manifest.yaml"
      - ".github/workflows/generate-abedome-test-update-manifest.yaml"
      - ".github/workflows/publish-abedome-dev-test-feed.yaml"
      - "scripts/render_abedome_update_manifest.py"
      - "updates/**"
  push:
    branches:
      - abedome/develop
    paths:
      - ".github/workflows/validate-abedome-update-manifest.yaml"
      - ".github/workflows/generate-abedome-test-update-manifest.yaml"
      - ".github/workflows/publish-abedome-dev-test-feed.yaml"
      - "scripts/render_abedome_update_manifest.py"
      - "updates/**"

permissions:
  contents: read

jobs:
  validate:
    name: Render offline test manifest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Render fixture
        run: |
          python3 scripts/render_abedome_update_manifest.py \
            --source updates/fixtures/upstream-dev.json \
            --output /tmp/abedome-supervisor-only-dev.json \
            --supervisor-version 2026.8.0.dev2 \
            --supervisor-version-baseline 2026.8.0.dev1 \
            --supervisor-image ghcr.io/mauro2020/abedome-supervisor \
            --core-version 2026.9.0.dev0 \
            --core-version-baseline 2026.9.0.dev0 \
            --core-image ghcr.io/mauro2020/abedome-core \
            --hassos-ova-version 18.0.dev00000000 \
            --ota-url-template 'https://updates.example.invalid/{version}/{os_name}_{board}-{version}.raucb'

          python3 scripts/render_abedome_update_manifest.py \
            --source updates/fixtures/upstream-dev.json \
            --output /tmp/abedome-core-only-dev.json \
            --supervisor-version 2026.8.0.dev1 \
            --supervisor-version-baseline 2026.8.0.dev1 \
            --supervisor-image ghcr.io/mauro2020/abedome-supervisor \
            --core-version 2026.9.0.dev1 \
            --core-version-baseline 2026.9.0.dev0 \
            --core-image ghcr.io/mauro2020/abedome-core \
            --hassos-ova-version 18.0.dev00000000 \
            --ota-url-template 'https://updates.example.invalid/{version}/{os_name}_{board}-{version}.raucb'

      - name: Verify rendered values
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          supervisor_only = json.loads(
              Path("/tmp/abedome-supervisor-only-dev.json").read_text()
          )
          core_only = json.loads(Path("/tmp/abedome-core-only-dev.json").read_text())

          assert supervisor_only["channel"] == "dev"
          assert supervisor_only["supervisor"] == "2026.8.0.dev2"
          assert supervisor_only["homeassistant"]["qemux86-64"] == "2026.9.0.dev0"
          assert core_only["supervisor"] == "2026.8.0.dev1"
          assert core_only["homeassistant"]["qemux86-64"] == "2026.9.0.dev1"

          for manifest in (supervisor_only, core_only):
              assert manifest["images"]["supervisor"] == "ghcr.io/mauro2020/abedome-supervisor"
              assert manifest["images"]["core"] == "ghcr.io/mauro2020/abedome-core"
              assert manifest["homeassistant"]["default"] == "2026.9.0.dev0"
              assert manifest["homeassistant"]["qemuarm-64"] == "2026.9.0.dev0"
              assert manifest["hassos"]["ova"] == "18.0.dev00000000"
          PY

      - name: Verify monotonic component development versions
        run: |
          python3 - <<'PY'
          import contextlib
          import io

          from scripts.render_abedome_update_manifest import (
              require_component_version_advance,
          )

          accepted = (
              # Supervisor-only advance.
              ("2026.8.0.dev2", "2026.8.0.dev1", "2026.9.0.dev1", "2026.9.0.dev1"),
              # Core-only advance.
              ("2026.8.0.dev2", "2026.8.0.dev2", "2026.9.0.dev2", "2026.9.0.dev1"),
              # Both components advance, using numeric rather than lexical ordering.
              ("2026.8.0.dev10", "2026.8.0.dev9", "2026.10.0.dev1", "2026.9.0.dev202608050310"),
          )
          rejected = (
              # Supervisor regression, even though Core advances.
              ("2026.8.0.dev2", "2026.8.0.dev3", "2026.9.0.dev2", "2026.9.0.dev1"),
              # Core regression, even though Supervisor advances.
              ("2026.8.0.dev3", "2026.8.0.dev2", "2026.9.0.dev1", "2026.9.0.dev2"),
              # Complete no-op.
              ("2026.8.0.dev2", "2026.8.0.dev2", "2026.9.0.dev1", "2026.9.0.dev1"),
              ("not-a-version", "2026.8.0.dev2", "2026.9.0.dev2", "2026.9.0.dev1"),
              ("2026.8.0.dev3", "2026.8.0.dev2", "2026.9.0.dev2", "not-a-version"),
          )

          for versions in accepted:
              require_component_version_advance(*versions)

          for versions in rejected:
              with contextlib.redirect_stderr(io.StringIO()):
                  try:
                      require_component_version_advance(*versions)
                  except SystemExit as err:
                      assert err.code == 2
                  else:
                      raise AssertionError(f"Expected rejection for {versions}")
          PY

      - name: Reject a Core version regression in the renderer
        run: |
          set +e
          python3 scripts/render_abedome_update_manifest.py \
            --source updates/fixtures/upstream-dev.json \
            --output /tmp/regressed-abedome-dev.json \
            --supervisor-version 2026.8.0.dev2 \
            --supervisor-version-baseline 2026.8.0.dev1 \
            --supervisor-image ghcr.io/mauro2020/abedome-supervisor \
            --core-version 2026.9.0.dev3 \
            --core-version-baseline 2026.9.0.dev202608050310 \
            --core-image ghcr.io/mauro2020/abedome-core \
            --hassos-ova-version 18.0.dev00000000 \
            --ota-url-template 'https://updates.example.invalid/{version}/{os_name}_{board}-{version}.raucb' \
            2>/tmp/regressed-core-error.log
          status=$?
          set -e

          if [ "${status}" -ne 2 ]; then
            echo "Expected renderer exit status 2, received ${status}."
            cat /tmp/regressed-core-error.log
            exit 1
          fi

          if ! grep -Fq \
            "Core version candidate 2026.9.0.dev3 must not be older than installed baseline 2026.9.0.dev202608050310" \
            /tmp/regressed-core-error.log; then
            echo "The renderer failed for an unexpected reason."
            cat /tmp/regressed-core-error.log
            exit 1
          fi

          if [ -e /tmp/regressed-abedome-dev.json ]; then
            echo "The renderer wrote a manifest for a rejected Core regression."
            exit 1
          fi

      - name: Reject a Supervisor version regression in the renderer
        run: |
          set +e
          python3 scripts/render_abedome_update_manifest.py \
            --source updates/fixtures/upstream-dev.json \
            --output /tmp/regressed-supervisor-abedome-dev.json \
            --supervisor-version 2026.8.0.dev2 \
            --supervisor-version-baseline 2026.8.0.dev202608050310 \
            --supervisor-image ghcr.io/mauro2020/abedome-supervisor \
            --core-version 2026.9.0.dev1 \
            --core-version-baseline 2026.9.0.dev0 \
            --core-image ghcr.io/mauro2020/abedome-core \
            --hassos-ova-version 18.0.dev00000000 \
            --ota-url-template 'https://updates.example.invalid/{version}/{os_name}_{board}-{version}.raucb' \
            2>/tmp/regressed-supervisor-error.log
          status=$?
          set -e

          if [ "${status}" -ne 2 ]; then
            echo "Expected renderer exit status 2, received ${status}."
            cat /tmp/regressed-supervisor-error.log
            exit 1
          fi

          if ! grep -Fq \
            "Supervisor version candidate 2026.8.0.dev2 must not be older than installed baseline 2026.8.0.dev202608050310" \
            /tmp/regressed-supervisor-error.log; then
            echo "The renderer failed for an unexpected reason."
            cat /tmp/regressed-supervisor-error.log
            exit 1
          fi

          if [ -e /tmp/regressed-supervisor-abedome-dev.json ]; then
            echo "The renderer wrote a manifest for a rejected Supervisor regression."
            exit 1
          fi

      - name: Reject a component version no-op in the renderer
        run: |
          set +e
          python3 scripts/render_abedome_update_manifest.py \
            --source updates/fixtures/upstream-dev.json \
            --output /tmp/no-op-abedome-dev.json \
            --supervisor-version 2026.8.0.dev2 \
            --supervisor-version-baseline 2026.8.0.dev2 \
            --supervisor-image ghcr.io/mauro2020/abedome-supervisor \
            --core-version 2026.9.0.dev1 \
            --core-version-baseline 2026.9.0.dev1 \
            --core-image ghcr.io/mauro2020/abedome-core \
            --hassos-ova-version 18.0.dev00000000 \
            --ota-url-template 'https://updates.example.invalid/{version}/{os_name}_{board}-{version}.raucb' \
            2>/tmp/no-op-error.log
          status=$?
          set -e

          if [ "${status}" -ne 2 ]; then
            echo "Expected renderer exit status 2, received ${status}."
            cat /tmp/no-op-error.log
            exit 1
          fi

          if ! grep -Fq \
            "at least one of Supervisor or Core must be newer than its installed baseline" \
            /tmp/no-op-error.log; then
            echo "The renderer failed for an unexpected reason."
            cat /tmp/no-op-error.log
            exit 1
          fi

          if [ -e /tmp/no-op-abedome-dev.json ]; then
            echo "The renderer wrote a manifest for a rejected component version no-op."
            exit 1
          fi

      - name: Reject a tagged Core repository
        run: |
          set +e
          python3 scripts/render_abedome_update_manifest.py \
            --source updates/fixtures/upstream-dev.json \
            --output /tmp/invalid-abedome-dev.json \
            --supervisor-version 2026.8.0.dev2 \
            --supervisor-version-baseline 2026.8.0.dev1 \
            --supervisor-image ghcr.io/mauro2020/abedome-supervisor \
            --core-version 2026.9.0.dev1 \
            --core-version-baseline 2026.9.0.dev0 \
            --core-image ghcr.io/mauro2020/abedome-core:2026.9.0.dev1 \
            --hassos-ova-version 18.0.dev00000000 \
            --ota-url-template 'https://updates.example.invalid/{version}/{os_name}_{board}-{version}.raucb' \
            2>/tmp/tagged-core-error.log
          status=$?
          set -e

          if [ "${status}" -ne 2 ]; then
            echo "Expected renderer exit status 2, received ${status}."
            cat /tmp/tagged-core-error.log
            exit 1
          fi

      - name: Reject a tagged Supervisor repository
        run: |
          set +e
          python3 scripts/render_abedome_update_manifest.py \
            --source updates/fixtures/upstream-dev.json \
            --output /tmp/invalid-supervisor-abedome-dev.json \
            --supervisor-version 2026.8.0.dev2 \
            --supervisor-version-baseline 2026.8.0.dev1 \
            --supervisor-image ghcr.io/mauro2020/abedome-supervisor:2026.8.0.dev2 \
            --core-version 2026.9.0.dev1 \
            --core-version-baseline 2026.9.0.dev0 \
            --core-image ghcr.io/mauro2020/abedome-core \
            --hassos-ova-version 18.0.dev00000000 \
            --ota-url-template 'https://updates.example.invalid/{version}/{os_name}_{board}-{version}.raucb' \
            2>/tmp/tagged-supervisor-error.log
          status=$?
          set -e

          if [ "${status}" -ne 2 ]; then
            echo "Expected renderer exit status 2, received ${status}."
            cat /tmp/tagged-supervisor-error.log
            exit 1
          fi

          if ! grep -Fq \
            "images.supervisor must be a repository without tag or digest" \
            /tmp/tagged-supervisor-error.log; then
            echo "The renderer failed for an unexpected reason."
            cat /tmp/tagged-supervisor-error.log
            exit 1
          fi

          if ! grep -Fq \
            "images.core must be a repository without tag or digest" \
            /tmp/tagged-core-error.log; then
            echo "The renderer failed for an unexpected reason."
            cat /tmp/tagged-core-error.log
            exit 1
          fi
